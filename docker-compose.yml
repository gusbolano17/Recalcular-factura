services:

  postgres:
    container_name: postgreSQL
    image: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: prueba_tecnica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: developer2026
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: