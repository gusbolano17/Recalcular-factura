<div class="container ml-auto mr-auto flex flex-wrap items-start mt-8">
  <div class="w-full pl-2 pr-2 mb-4 mt-4">
    <h1 class="text-3xl font-extrabold text-center">Factura 1</h1>
  </div>
</div>
<div class="container ml-auto mr-auto flex items-center justify-center">
  <div class="w-full md:w-1/2">
    <form class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
      <div class="mb-4">
        <mat-form-field class="w-full">
          <mat-label>Numero</mat-label>
          <input matInput placeholder="Numero de factura" value="1" disabled />
        </mat-form-field>
      </div>
      <div class="mb-4">
        <mat-form-field class="w-full">
          <mat-label>Cliente</mat-label>
          <input matInput placeholder="Nombre del cliente" value="Cliente 1" disabled />
        </mat-form-field>
      </div>
      <div class="mb-4">
        <mat-form-field class="w-full">
          <mat-label>Fecha</mat-label>
          <input matInput placeholder="Fecha de la factura" value="2025-01-01" disabled />
        </mat-form-field>
      </div>
      <div class="mb-4">
        <mat-form-field class="w-full">
          <mat-label>Responsable</mat-label>
          <input matInput placeholder="Nombre del responsable" value="ADMIN" disabled />
        </mat-form-field>
      </div>
      <div class="mb-4">
        <mat-form-field class="w-full">
          <mat-label>Estado</mat-label>
          <input matInput placeholder="Estado de la factura" value="Pendiente" disabled />
        </mat-form-field>
      </div>
      <div class="mb-4">
        <mat-form-field class="w-full">
          <mat-label>Subtotal</mat-label>
          <input matInput type="number" placeholder="Subtotal de la factura" />
        </mat-form-field>
      </div>
      <div class="mb-4">
        <mat-form-field class="w-full">
          <mat-label>Impuesto</mat-label>
          <input matInput placeholder="Valor del impuesto" value="$5.00" disabled />
        </mat-form-field>
      </div>
      <div class="mb-4">
        <mat-form-field class="w-full">
          <mat-label>Total</mat-label>
          <input matInput placeholder="Total de la factura" value="$105.00" disabled />
        </mat-form-field>
      </div>
    </form>
    <div class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4 overflow-x-auto">
      <table mat-table [dataSource]="datasource" class="mat-elevation-z8">
        <ng-container matColumnDef="producto">
          <th mat-header-cell *matHeaderCellDef>Producto</th>
          <td mat-cell *matCellDef="let element">{{ element.producto }}</td>
        </ng-container>

        <ng-container matColumnDef="cantidad">
          <th mat-header-cell *matHeaderCellDef>Cantidad</th>
          <td mat-cell *matCellDef="let element">{{ element.cantidad }}</td>
        </ng-container>

        <ng-container matColumnDef="precioUnitario">
          <th mat-header-cell *matHeaderCellDef>Precio Unitario</th>
          <td mat-cell *matCellDef="let element">{{ element.precioUnitario }}</td>
        </ng-container>

        <ng-container matColumnDef="total">
          <th mat-header-cell *matHeaderCellDef>Total</th>
          <td mat-cell *matCellDef="let element">{{ element.total }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  </div>
</div>
